<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for central hub -->
    <linearGradient id="hubGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for tool nodes -->
    <linearGradient id="nodeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8e53;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGradient)" rx="60"/>
  
  <!-- Connection lines (network effect) -->
  <g stroke="#00d4ff" stroke-width="3" opacity="0.3" fill="none">
    <!-- Lines from center to nodes -->
    <line x1="256" y1="256" x2="150" y2="150" />
    <line x1="256" y1="256" x2="362" y2="150" />
    <line x1="256" y1="256" x2="150" y2="362" />
    <line x1="256" y1="256" x2="362" y2="362" />
    <line x1="256" y1="256" x2="256" y2="100" />
    <line x1="256" y1="256" x2="256" y2="412" />
    <line x1="256" y1="256" x2="100" y2="256" />
    <line x1="256" y1="256" x2="412" y2="256" />
  </g>
  
  <!-- Outer ring decoration -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.2"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.1"/>
  
  <!-- Tool nodes (8 nodes representing different toolsets) -->
  <!-- Top -->
  <g transform="translate(256, 100)">
    <circle r="35" fill="url(#nodeGradient)" filter="url(#glow)"/>
    <path d="M-15,-10 L15,-10 L15,10 L-15,10 Z M-10,-5 L10,-5 M-10,0 L10,0 M-10,5 L5,5" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Top-Right -->
  <g transform="translate(362, 150)">
    <circle r="35" fill="url(#nodeGradient)" filter="url(#glow)"/>
    <path d="M-12,8 L-5,-8 L0,0 L5,-12 L12,8" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Right -->
  <g transform="translate(412, 256)">
    <circle r="35" fill="url(#nodeGradient)" filter="url(#glow)"/>
    <circle cx="-5" cy="-5" r="4" fill="white"/>
    <circle cx="5" cy="-5" r="4" fill="white"/>
    <circle cx="0" cy="5" r="4" fill="white"/>
  </g>
  
  <!-- Bottom-Right -->
  <g transform="translate(362, 362)">
    <circle r="35" fill="url(#nodeGradient)" filter="url(#glow)"/>
    <rect x="-12" y="-8" width="24" height="16" rx="2" stroke="white" stroke-width="3" fill="none"/>
    <line x1="-12" y1="-2" x2="12" y2="-2" stroke="white" stroke-width="2"/>
  </g>
  
  <!-- Bottom -->
  <g transform="translate(256, 412)">
    <circle r="35" fill="url(#nodeGradient)" filter="url(#glow)"/>
    <path d="M-10,-10 L10,10 M10,-10 L-10,10" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <circle r="15" stroke="white" stroke-width="3" fill="none"/>
  </g>
  
  <!-- Bottom-Left -->
  <g transform="translate(150, 362)">
    <circle r="35" fill="url(#nodeGradient)" filter="url(#glow)"/>
    <path d="M-8,-8 L8,-8 L8,8 L-8,8 Z M-4,-4 L4,-4 M-4,0 L4,0 M-4,4 L0,4" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Left -->
  <g transform="translate(100, 256)">
    <circle r="35" fill="url(#nodeGradient)" filter="url(#glow)"/>
    <path d="M-10,0 L10,0 M0,-10 L0,10" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <circle r="12" stroke="white" stroke-width="2.5" fill="none"/>
  </g>
  
  <!-- Top-Left -->
  <g transform="translate(150, 150)">
    <circle r="35" fill="url(#nodeGradient)" filter="url(#glow)"/>
    <path d="M-8,8 L0,-8 L8,8 M-4,2 L4,2" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Central hub (LCP Core) -->
  <g transform="translate(256, 256)">
    <!-- Outer glow ring -->
    <circle r="70" fill="none" stroke="#00d4ff" stroke-width="4" opacity="0.5" filter="url(#glow)"/>
    <!-- Main circle -->
    <circle r="60" fill="url(#hubGradient)" filter="url(#glow)"/>
    <!-- Inner highlight -->
    <circle r="50" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    
    <!-- Central icon - stylized "LCP" or tool symbol -->
    <g transform="translate(0, -5)">
      <!-- Wrench/tool symbol -->
      <path d="M-20,-15 L-5,-15 L-5,-5 L15,-5 L15,5 L-5,5 L-5,15 L-20,15 Z" fill="white" opacity="0.9"/>
      <circle cx="20" cy="0" r="8" fill="white" opacity="0.9"/>
      <circle cx="20" cy="0" r="4" fill="#0099ff"/>
    </g>
    
    <!-- Text "LCP" -->
    <text x="0" y="35" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold" letter-spacing="2">LCP</text>
  </g>
  
  <!-- Small decorative dots -->
  <circle cx="80" cy="80" r="4" fill="#00d4ff" opacity="0.6"/>
  <circle cx="432" cy="80" r="4" fill="#00d4ff" opacity="0.6"/>
  <circle cx="80" cy="432" r="4" fill="#00d4ff" opacity="0.6"/>
  <circle cx="432" cy="432" r="4" fill="#00d4ff" opacity="0.6"/>
</svg>