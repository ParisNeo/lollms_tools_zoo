<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)" rx="80"/>
  
  <!-- Network nodes -->
  <g fill="#ff6b6b">
    <circle cx="150" cy="150" r="30"/>
    <circle cx="362" cy="150" r="30"/>
    <circle cx="150" cy="362" r="30"/>
    <circle cx="362" cy="362" r="30"/>
  </g>
  
  <!-- Connections -->
  <g stroke="#00d4ff" stroke-width="8" opacity="0.4">
    <line x1="256" y1="256" x2="150" y2="150"/>
    <line x1="256" y1="256" x2="362" y2="150"/>
    <line x1="256" y1="256" x2="150" y2="362"/>
    <line x1="256" y1="256" x2="362" y2="362"/>
  </g>
  
  <!-- Central hub -->
  <circle cx="256" cy="256" r="80" fill="url(#coreGrad)"/>
  <circle cx="256" cy="256" r="70" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="3"/>
  
  <!-- Tool icon in center -->
  <g transform="translate(256, 256)">
    <path d="M-25,-20 L-10,-20 L-10,-8 L20,-8 L20,8 L-10,8 L-10,20 L-25,20 Z" fill="white"/>
    <circle cx="28" cy="0" r="10" fill="white"/>
    <circle cx="28" cy="0" r="5" fill="#0099ff"/>
  </g>
</svg>